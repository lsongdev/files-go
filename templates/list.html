{{define "page"}}

<style>
  .files {
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .files a {
    text-decoration: none;
  }

  .file {
    display: flex;
    align-items: center;
    overflow: hidden;
    gap: 10px;
    padding: 10px;
    background-color: #f5f5f5;
    border-radius: 5px;
    transition: background-color 500ms;
  }

  .file:hover {
    background-color: #efefef;
  }

  .file-icon {
    display: block;
    width: 65px;
    min-width: 65px;
  }

  .file-title {
    color: #111;
    font-weight: bold;
    text-overflow: ellipsis;
    word-break: break-all;
  }

  .file-content {
    display: flex;
    text-decoration: none;
    flex-direction: column;
  }

  .file-line1,
  .file-line2 {
    color: #333;
  }

  form {
    margin-top: 20px;
  }

  @media screen and (min-width: 768px) {
    .files {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .files .file {
      text-align: center;
      flex-direction: column;
    }

    .files .file-icon {
      width: auto;
      height: 100px;
    }

    .files .file-size {
      display: none;
    }

  }
</style>

{{$source := .source}}
{{$size := .size}}

<form action="/files" class="card flex flex-jc-between">
  <div>
    <button onclick="history.back(); return false;">Back</button>
    <select name="source">
      {{range $i, $library := .Config.Libraries}}
      <option value="{{$i}}" {{if eq $i $source }}selected{{end}}>{{$library.Name}}</option>
      {{end}}
    </select>
    <input type="text" name="path" value="{{.path}}">
    <button>Go</button>
  </div>

  <div>
    <button>Prev</button>
    <input type="number" name="page" value="{{.page}}">
    <select name="size">
      <option {{if eq $size 10 }}selected{{end}} value="10">10</option>
      <option {{if eq $size 50 }}selected{{end}} value="50">50</option>
      <option {{if eq $size 100 }}selected{{end}} value="100">100</option>
      <option {{if eq $size 200 }}selected{{end}} value="200">200</option>
      <option {{if eq $size 500 }}selected{{end}} value="500">500</option>
    </select>
    <button>Next</button>
  </div>
</form>

<ul class="files">
  {{range .files}}
  <a href="?source={{$source}}&path={{ if eq .Path " /" }}{{.Path}}{{.Name}}{{else}}{{.Path}}/{{.Name}}{{end}}"
    class="file">
    <img class="file-icon" src="{{.Icon}}" alt="📃" loading="lazy" />
    <div class="file-content">
      <span class="file-title">{{.Title}}</span>
      <span class="file-line1">{{.Line1}}</span>
      <span class="file-line2">{{.Line2}}</span>
      <span class="file-line3">{{.Line3}}</span>
      {{ if not .Title }}<span class="file-name">{{.Name}}</span>{{ end }}
      <span class="file-size">{{.Size}}</span>
    </div>
  </a>
  {{end}}
</ul>
{{end}}
