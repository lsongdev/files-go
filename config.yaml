
listen: ":8088"

data: ""


processing:
  workers: 2
  # Presence means enabled; list order is processing order.
  # Omit plugins entirely to use this built-in order.
  plugins: [image, video, movies, music, ebook, document]
  ffprobe: ffprobe
  ffmpeg: ffmpeg
  pdfinfo: pdfinfo
  pdftoppm: pdftoppm

media:
  tmdb:
    token: "${TMDB_TOKEN}"
    token_file: ".tmdb-token"
    language: zh-CN

storages:
  - id: data
    name: Data
    type: local
    path: /Volumes/data

  - id: local_documents
    name: Local Documents
    type: local
    path: /Users/Lsong/Documents

libraries:
  - id: movies
    name: Movies
    type: movies
    sources:
      - storage: data
        path: Videos/Movies

  - id: tvshows
    name: TV Shows
    type: tv
    sources:
      - storage: data
        path: Videos/TV Shows

  - id: music
    name: Music
    type: music
    sources:
      - storage: data
        path: Music

  - id: photos
    name: Photos
    type: photos
    sources:
      - storage: data
        path: Pictures

  - id: documents
    name: Documents
    type: files
    sources:
      - storage: local_documents
        path: ""
